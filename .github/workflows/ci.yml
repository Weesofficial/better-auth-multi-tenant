name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        include:
          # The lockfile pins one Better Auth release; these run the suite
          # (SSO and teams included) against the newest release and the 1.6
          # line, the oldest supported one.
          - node: 24
            deps: latest
          - node: 24
            deps: release-1.6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.deps
        run: npm install --no-save --legacy-peer-deps better-auth@${{ matrix.deps }} @better-auth/sso@${{ matrix.deps }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
