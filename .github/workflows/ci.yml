name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        # An include entry whose keys all match a combination is merged into it,
        # so without this axis the two jobs below would replace the plain
        # Node 24 job instead of being added next to it.
        deps: [lockfile]
        include:
          # The lockfile pins one Better Auth release; these run the suite
          # (SSO and teams included) against the newest release and the 1.6
          # line, the oldest supported one.
          - node: 24
            deps: latest
          - node: 24
            deps: release-1.6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Not --no-save: npm 10 crashes on it (Cannot read properties of null, edgesOut).
      # Every Better Auth package moves together, and better-call is pinned to the
      # release's own version: the lockfile can leave a second copy of it (or a
      # newer @better-auth/core) behind, and two copies make the types disagree.
      - if: matrix.deps != 'lockfile'
        run: |
          better_call="$(npm view better-auth@${{ matrix.deps }} dependencies.better-call)"
          npm install --no-audit --no-fund --legacy-peer-deps \
            better-auth@${{ matrix.deps }} @better-auth/core@${{ matrix.deps }} @better-auth/sso@${{ matrix.deps }} \
            @better-auth/api-key@${{ matrix.deps }} @better-auth/passkey@${{ matrix.deps }} "better-call@$better_call"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
