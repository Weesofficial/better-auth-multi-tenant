name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (node ${{ matrix.node }}, better-auth ${{ matrix.better-auth }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        # The oldest supported release line and the current one.
        better-auth: ["1.6", "1.7"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Not --no-save: npm 10 crashes on it (Cannot read properties of null, edgesOut).
      - run: npm install --no-audit --no-fund better-auth@${{ matrix.better-auth }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
